<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧考場電子黑板與即時公告系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f4f8; /* 淺藍灰底色 */
            margin: 0;
            overflow-x: hidden;
        }
        /* 日式深藍色黑板 (已移除底部黑線與多餘高度) */
        .chalkboard-bg {
            background-color: #1a2f4c; 
            background-image: radial-gradient(#2a4060 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .hand-drawn-border {
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 8px 12px 10px 6px / 10px 6px 12px 8px;
            background: rgba(255, 255, 255, 0.08);
        }
        .glow-text {
            text-shadow: 0 0 12px rgba(255,255,255,0.4);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 80;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- App Container (預設顯示) -->
    <div id="app" class="w-full h-full flex flex-col">
        
        <!-- 上半部：黑板與考試時程 (高度隨內容縮放) -->
        <div class="chalkboard-bg text-white shadow-xl relative flex-shrink-0 p-4 md:p-6 flex flex-col items-center">
            
            <!-- 左上角：小圖示管理控制項 -->
            <div class="absolute top-4 left-4 flex gap-2 z-20">
                <button id="btn-fullscreen" class="bg-indigo-600/80 hover:bg-indigo-500 text-white px-3 py-1.5 rounded shadow text-sm backdrop-blur-sm transition flex items-center">
                    <i class="fa-solid fa-expand mr-1.5"></i>全螢幕
                </button>
                <button id="btn-login-modal" class="bg-blue-600/80 hover:bg-blue-500 text-white px-3 py-1.5 rounded shadow text-sm backdrop-blur-sm transition flex items-center">
                    <i class="fa-solid fa-user mr-1.5"></i>登入
                </button>
                <button id="btn-admin-panel" class="hidden bg-blue-700 hover:bg-blue-600 text-white px-3 py-1.5 rounded shadow text-sm backdrop-blur-sm transition flex items-center">
                    <i class="fa-solid fa-gear mr-1.5"></i>管理後台
                </button>
                <button id="btn-logout" class="hidden bg-red-500/80 hover:bg-red-500 text-white px-3 py-1.5 rounded shadow text-sm backdrop-blur-sm transition flex items-center">
                    <i class="fa-solid fa-sign-out-alt mr-1.5"></i>登出
                </button>
            </div>

            <!-- 右上角：時鐘 -->
            <div class="absolute top-4 right-8 text-right z-20">
                <div class="text-5xl md:text-7xl font-bold font-mono tracking-widest glow-text mb-1 md:mb-2" id="main-clock">00:00:00</div>
                <p class="text-blue-100 text-base md:text-xl tracking-widest opacity-90">各位同學，考試加油！細心作答喔！</p>
            </div>

            <!-- 正上方：科目時程表 (移除多餘底部高度，自然撐開空間) -->
            <div class="relative z-10 w-full flex justify-center mt-2 pb-4">
                <div id="schedule-container" class="flex flex-wrap gap-4 md:gap-6 justify-center max-w-[50%] min-h-[100px]">
                    <!-- 預設載入文字，資料載入後會被替換 -->
                    <div class="text-gray-400 opacity-60 mt-6">載入時程中...</div>
                </div>
            </div>
        </div>

        <!-- 下半部：出席人數與即時公告 -->
        <div class="flex-1 p-6 flex gap-6 overflow-hidden bg-[#e0eaf5]">
            
            <!-- 左側：出席人數面板 -->
            <div class="w-1/3 bg-white rounded-2xl shadow-sm border border-blue-100 flex flex-col overflow-hidden">
                <div class="p-5 border-b border-blue-50 bg-white flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-users text-blue-600 mr-3"></i>考場出席人數即時看板
                    </h2>
                    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-bold">即時連線同步</span>
                </div>
                <div class="p-6 flex-1 flex flex-col gap-6">
                    <div class="flex gap-4">
                        <div class="flex-1 bg-slate-50 rounded-xl p-4 border border-slate-200">
                            <p class="text-sm text-slate-500 font-bold mb-1">應到人數</p>
                            <div class="text-4xl font-black text-slate-700"><span id="board-expected">0</span> <span class="text-lg font-normal text-slate-400">人</span></div>
                        </div>
                        <div class="flex-1 bg-blue-50 rounded-xl p-4 border border-blue-200">
                            <p class="text-sm text-blue-700 font-bold mb-1">實到人數</p>
                            <div class="text-4xl font-black text-blue-600"><span id="board-actual">0</span> <span class="text-lg font-normal text-blue-600/70">人</span></div>
                        </div>
                    </div>
                    
                    <!-- 修正：改為橫向排列 (justify-between, items-center)，讓數字在標題旁邊 -->
                    <div class="flex-1 bg-red-50/80 rounded-xl p-6 border border-red-100 flex justify-between items-center relative overflow-hidden">
                        <i class="fa-solid fa-user-xmark absolute text-9xl text-red-500/5 -right-2 -bottom-6"></i>
                        <h3 class="text-xl font-bold text-red-800 z-10">缺席總數</h3>
                        <div class="text-6xl md:text-7xl font-black text-red-600 z-10 leading-none drop-shadow-sm"><span id="board-absent">0</span> <span class="text-2xl font-bold text-red-400 ml-1">人</span></div>
                    </div>
                </div>
            </div>

            <!-- 右側：公告面板 -->
            <div class="w-2/3 bg-white rounded-2xl shadow-sm border border-blue-100 flex flex-col overflow-hidden relative">
                <div class="p-5 border-b border-blue-50 bg-white flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center">
                        <i class="fa-regular fa-bell text-amber-500 mr-3"></i>試題更正與考務即時公告
                    </h2>
                    <span class="text-sm text-slate-500" id="announcement-count-label">共 0 則</span>
                </div>
                
                <!-- 無公告狀態 -->
                <div id="no-announcement-state" class="flex-1 flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-solid fa-mug-hot text-6xl mb-4 opacity-50"></i>
                    <p class="text-lg font-bold">目前無任何考務公告</p>
                    <p class="text-sm mt-2">請安心應考</p>
                </div>

                <!-- 公告列表 -->
                <div id="announcement-container" class="flex-1 overflow-y-auto p-6 hidden space-y-6 bg-slate-50/50">
                    <!-- Cards Injected Here -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Login Modal -->
    <div id="modal-login" class="modal justify-center items-center z-[90]">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden fade-in">
            <div class="bg-blue-700 text-white p-6 text-center relative">
                <button class="absolute top-4 right-4 text-white/70 hover:text-white close-login-modal"><i class="fa-solid fa-xmark text-xl"></i></button>
                <i class="fa-solid fa-school text-4xl mb-3"></i>
                <h2 class="text-2xl font-bold">系統登入</h2>
            </div>
            <div class="p-6">
                <div class="flex rounded-lg bg-slate-100 p-1 mb-6">
                    <button id="tab-student" class="flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-blue-700 transition">班級登入</button>
                    <button id="tab-admin" class="flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition">管理員登入</button>
                </div>

                <div id="form-student">
                    <div class="mb-4">
                        <label class="block text-slate-700 text-sm font-bold mb-2">選擇班級</label>
                        <select id="login-class-select" class="w-full p-3 border border-slate-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            <option value="">載入班級中...</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-slate-700 text-sm font-bold mb-2">班級密碼</label>
                        <input type="password" id="login-class-pin" class="w-full p-3 border border-slate-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="輸入密碼">
                    </div>
                    <button id="btn-login-class" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition">
                        登入
                    </button>
                </div>

                <div id="form-admin" class="hidden">
                    <div class="mb-6">
                        <label class="block text-slate-700 text-sm font-bold mb-2">管理員密碼</label>
                        <input type="password" id="login-admin-pass" class="w-full p-3 border border-slate-300 rounded focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500" placeholder="輸入管理員密碼 (預設: admin)">
                    </div>
                    <button id="btn-login-admin" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded transition">
                        登入管理後台
                    </button>
                </div>
                <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden"></p>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="modal-admin" class="modal justify-center items-center py-8 z-[80]">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl h-full max-h-[90vh] flex flex-col fade-in">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h2 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-gear text-slate-500 mr-2"></i>系統管理後台</h2>
                <button id="btn-close-admin" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <div class="flex-1 flex overflow-hidden">
                <!-- Sidebar -->
                <div class="w-48 bg-slate-100 border-r border-slate-200 flex flex-col p-4 gap-2">
                    <button class="admin-tab-btn active w-full text-left px-4 py-3 rounded-lg font-bold bg-white shadow-sm text-blue-600" data-target="admin-classes">班級管理</button>
                    <button class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg font-bold text-slate-600 hover:bg-slate-200" data-target="admin-schedules">考試時程</button>
                    <button class="admin-tab-btn w-full text-left px-4 py-3 rounded-lg font-bold text-slate-600 hover:bg-slate-200" data-target="admin-announcements">即時公告</button>
                </div>
                <!-- Content Area -->
                <div class="flex-1 overflow-y-auto p-6 bg-white relative">
                    <!-- Panels -->
                    <div id="admin-classes" class="admin-panel block">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold">班級列表</h3>
                            <button id="btn-add-class" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-plus mr-1"></i>新增班級</button>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 text-sm">
                                    <th class="p-3 border-b">班級名稱</th><th class="p-3 border-b">年級</th><th class="p-3 border-b">密碼</th><th class="p-3 border-b">應到/實到</th><th class="p-3 border-b">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-class-list" class="text-sm"></tbody>
                        </table>
                    </div>
                    <div id="admin-schedules" class="admin-panel hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold">考試時程管理</h3>
                            <button id="btn-add-schedule" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-plus mr-1"></i>新增時程</button>
                        </div>
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 text-sm">
                                    <th class="p-3 border-b">科目</th><th class="p-3 border-b">適用年級</th><th class="p-3 border-b">時間</th><th class="p-3 border-b">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-schedule-list" class="text-sm"></tbody>
                        </table>
                    </div>
                    <div id="admin-announcements" class="admin-panel hidden">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold">公告管理</h3>
                            <button id="btn-add-announcement" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"><i class="fa-solid fa-plus mr-1"></i>新增公告</button>
                        </div>
                        <div class="space-y-4" id="admin-announcement-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Generic Input Modal -->
    <div id="modal-form" class="modal justify-center items-center z-[100]">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden fade-in">
            <div class="p-4 bg-slate-100 border-b flex justify-between items-center">
                <h3 class="font-bold text-slate-800" id="form-modal-title">表單</h3>
                <button class="close-form-modal text-slate-500 hover:text-slate-800">&times;</button>
            </div>
            <div class="p-5" id="form-modal-body"></div>
            <div class="p-4 border-t bg-slate-50 flex justify-end gap-2">
                <button class="close-form-modal px-4 py-2 bg-slate-200 text-slate-700 rounded hover:bg-slate-300">取消</button>
                <button id="btn-form-save" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">儲存</button>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div id="modal-msg" class="modal justify-center items-center z-[110]">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden fade-in text-center p-6">
            <div id="msg-icon" class="text-4xl mb-4"></div>
            <h3 class="font-bold text-xl text-slate-800 mb-2" id="msg-title">訊息</h3>
            <p class="text-slate-600 mb-6" id="msg-content">內容</p>
            <button id="btn-msg-ok" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold">確定</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ 請填入您的 Firebase 設定 (重要！)
                const firebaseConfig = {
  apiKey: "AIzaSyDMhYJCiaND_Iqhe0YLknBsoznSk2JasVY",
  authDomain: "examsystem-507ea.firebaseapp.com",
  projectId: "examsystem-507ea",
  storageBucket: "examsystem-507ea.firebasestorage.app",
  messagingSenderId: "745111861914",
  appId: "1:745111861914:web:c48518d8424fb8ea297d23"
};

        
        let app, db;
        let state = {
            role: 'public', // public, class, admin
            classInfo: null,
            classes: [], schedules: [], announcements: [],
            unsubscribeFns: []
        };

        // 修正 Firebase 路徑錯誤：集合名稱必須是奇數片段
        const getCollectionPath = (colName) => colName; 

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                
                setupUIBindings();
                fetchInitialClasses();
                
                // 預設為公開模式，抓取全部資料展示
                startPublicMode();
                
            } catch (err) {
                console.error("Firebase init error:", err);
                showMsg('錯誤', '無法連接資料庫，請檢查設定檔。', 'error');
            }
        }

        async function fetchInitialClasses() {
            try {
                const q = collection(db, getCollectionPath('classes'));
                const snapshot = await getDocs(q);
                state.classes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const select = document.getElementById('login-class-select');
                select.innerHTML = '<option value="">請選擇班級</option>';
                state.classes.sort((a,b) => a.name.localeCompare(b.name)).forEach(cls => {
                    const opt = document.createElement('option');
                    opt.value = cls.id;
                    opt.textContent = `${cls.name}`;
                    select.appendChild(opt);
                });
            } catch (err) { console.error(err); }
        }

        function setupUIBindings() {
            setInterval(updateClock, 1000); updateClock();

            // 全螢幕切換功能
            const btnFullscreen = document.getElementById('btn-fullscreen');
            btnFullscreen.onclick = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        showMsg('錯誤', `無法進入全螢幕: ${err.message}`, 'error');
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            };
            
            // 監聽全螢幕狀態改變按鈕文字與圖示
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    btnFullscreen.innerHTML = '<i class="fa-solid fa-compress mr-1.5"></i>離開全螢幕';
                } else {
                    btnFullscreen.innerHTML = '<i class="fa-solid fa-expand mr-1.5"></i>全螢幕';
                }
            });

            // 登入按鈕與彈窗
            document.getElementById('btn-login-modal').onclick = () => document.getElementById('modal-login').classList.add('active');
            document.querySelectorAll('.close-login-modal').forEach(btn => btn.onclick = () => document.getElementById('modal-login').classList.remove('active'));

            // 登入頁籤切換
            document.getElementById('tab-student').onclick = () => {
                document.getElementById('tab-student').className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-blue-700 transition";
                document.getElementById('tab-admin').className = "flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition";
                document.getElementById('form-student').classList.remove('hidden');
                document.getElementById('form-admin').classList.add('hidden');
            };
            document.getElementById('tab-admin').onclick = () => {
                document.getElementById('tab-admin').className = "flex-1 py-2 text-sm font-bold rounded-md bg-white shadow text-slate-800 transition";
                document.getElementById('tab-student').className = "flex-1 py-2 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition";
                document.getElementById('form-admin').classList.remove('hidden');
                document.getElementById('form-student').classList.add('hidden');
            };

            // 登入登出邏輯
            document.getElementById('btn-login-class').onclick = handleClassLogin;
            document.getElementById('btn-login-admin').onclick = handleAdminLogin;
            document.getElementById('btn-logout').onclick = handleLogout;
            
            // 管理後台
            document.getElementById('btn-admin-panel').onclick = () => document.getElementById('modal-admin').classList.add('active');
            document.getElementById('btn-close-admin').onclick = () => document.getElementById('modal-admin').classList.remove('active');

            document.querySelectorAll('.admin-tab-btn').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.admin-tab-btn').forEach(b => {
                        b.classList.remove('active', 'bg-white', 'shadow-sm', 'text-blue-600');
                        b.classList.add('text-slate-600', 'hover:bg-slate-200');
                    });
                    e.target.classList.add('active', 'bg-white', 'shadow-sm', 'text-blue-600');
                    e.target.classList.remove('text-slate-600', 'hover:bg-slate-200');
                    document.querySelectorAll('.admin-panel').forEach(p => p.classList.add('hidden'));
                    document.getElementById(e.target.dataset.target).classList.remove('hidden');
                };
            });

            document.querySelectorAll('.close-form-modal').forEach(btn => {
                btn.onclick = () => document.getElementById('modal-form').classList.remove('active');
            });

            document.getElementById('btn-add-class').onclick = () => openFormModal('class');
            document.getElementById('btn-add-schedule').onclick = () => openFormModal('schedule');
            document.getElementById('btn-add-announcement').onclick = () => openFormModal('announcement');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('main-clock').innerText = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function clearSubscriptions() {
            state.unsubscribeFns.forEach(fn => fn());
            state.unsubscribeFns = [];
        }

        function startPublicMode() {
            state.role = 'public';
            document.getElementById('btn-login-modal').classList.remove('hidden');
            document.getElementById('btn-admin-panel').classList.add('hidden');
            document.getElementById('btn-logout').classList.add('hidden');
            
            subscribeToData();
            subscribeToAllClasses();
        }

        function handleClassLogin() {
            const classId = document.getElementById('login-class-select').value;
            const pin = document.getElementById('login-class-pin').value;
            const errorEl = document.getElementById('login-error');
            
            const targetClass = state.classes.find(c => c.id === classId);
            if (targetClass && targetClass.pin === pin) {
                state.role = 'class';
                state.classInfo = targetClass;
                document.getElementById('modal-login').classList.remove('active');
                errorEl.classList.add('hidden');
                
                clearSubscriptions();
                document.getElementById('btn-login-modal').classList.add('hidden');
                document.getElementById('btn-admin-panel').classList.add('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                
                subscribeToData(state.classInfo.grade);
                subscribeToCurrentClass(state.classInfo.id);
            } else {
                errorEl.innerText = "密碼錯誤"; errorEl.classList.remove('hidden');
            }
        }

        function handleAdminLogin() {
            const pass = document.getElementById('login-admin-pass').value;
            const errorEl = document.getElementById('login-error');
            
            if (pass === 'admin') { 
                state.role = 'admin';
                document.getElementById('modal-login').classList.remove('active');
                errorEl.classList.add('hidden');
                
                clearSubscriptions();
                document.getElementById('btn-login-modal').classList.add('hidden');
                document.getElementById('btn-admin-panel').classList.remove('hidden');
                document.getElementById('btn-logout').classList.remove('hidden');
                
                subscribeToData();
                subscribeToAllClasses();
            } else {
                errorEl.innerText = "管理員密碼錯誤"; errorEl.classList.remove('hidden');
            }
        }

        function handleLogout() {
            clearSubscriptions();
            document.getElementById('login-class-pin').value = '';
            document.getElementById('login-admin-pass').value = '';
            startPublicMode();
        }

        function subscribeToData(gradeFilter = null) {
            const schCol = collection(db, getCollectionPath('schedules'));
            const unsubSch = onSnapshot(schCol, (snapshot) => {
                let schedules = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                if (gradeFilter) schedules = schedules.filter(s => s.grade === gradeFilter || s.grade === 'all');
                schedules.sort((a, b) => a.startTime.localeCompare(b.startTime));
                state.schedules = schedules;
                renderSchedules();
                if(state.role === 'admin') renderAdminSchedules();
            });
            state.unsubscribeFns.push(unsubSch);

            const annCol = collection(db, getCollectionPath('announcements'));
            const unsubAnn = onSnapshot(annCol, (snapshot) => {
                let announcements = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                announcements.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                if (gradeFilter) announcements = announcements.filter(a => a.grade === gradeFilter || a.grade === 'all');
                state.announcements = announcements;
                renderAnnouncements();
                if(state.role === 'admin') renderAdminAnnouncements();
            });
            state.unsubscribeFns.push(unsubAnn);
        }

        function subscribeToCurrentClass(classId) {
            const unsubClass = onSnapshot(doc(db, getCollectionPath('classes'), classId), (docSnap) => {
                if (docSnap.exists()) {
                    const d = docSnap.data();
                    updateAttendanceBoard(d.expected || 0, d.actual || 0);
                }
            });
            state.unsubscribeFns.push(unsubClass);
        }

        function subscribeToAllClasses() {
            const unsubClasses = onSnapshot(collection(db, getCollectionPath('classes')), (snapshot) => {
                state.classes = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                if(state.role === 'admin') renderAdminClasses();
                
                const expected = state.classes.reduce((sum, c) => sum + (parseInt(c.expected)||0), 0);
                const actual = state.classes.reduce((sum, c) => sum + (parseInt(c.actual)||0), 0);
                updateAttendanceBoard(expected, actual);
            });
            state.unsubscribeFns.push(unsubClasses);
        }

        function updateAttendanceBoard(expected, actual) {
            document.getElementById('board-expected').innerText = expected;
            document.getElementById('board-actual').innerText = actual;
            document.getElementById('board-absent').innerText = Math.max(0, expected - actual);
        }

        function renderSchedules() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            if (state.schedules.length === 0) {
                container.innerHTML = '<div class="text-white p-4 opacity-50 mt-6">目前無考試排程</div>';
                return;
            }
            state.schedules.forEach(s => {
                container.innerHTML += `
                <div class="hand-drawn-border p-3 md:p-4 w-40 md:w-48 flex flex-col justify-between backdrop-blur-sm">
                    <div class="flex justify-between items-center border-b border-white/30 pb-2 mb-3">
                        <span class="text-xl md:text-2xl font-bold tracking-widest">${s.subject}</span>
                        <div class="text-white/60 text-xs md:text-sm"><i class="fa-solid fa-pencil mr-1"></i><i class="fa-solid fa-eraser"></i></div>
                    </div>
                    <div class="flex items-center text-base md:text-lg font-mono tracking-wider font-bold">
                        <i class="fa-regular fa-clock text-white/50 mr-2 md:mr-3 text-xl md:text-2xl"></i>
                        <div><div>${s.startTime}</div><div class="text-white/70">${s.endTime}</div></div>
                    </div>
                </div>`;
            });
        }

        function renderAnnouncements() {
            const container = document.getElementById('announcement-container');
            const noDataState = document.getElementById('no-announcement-state');
            document.getElementById('announcement-count-label').innerText = `共 ${state.announcements.length} 則`;
            
            if (state.announcements.length === 0) {
                noDataState.classList.remove('hidden'); container.classList.add('hidden');
                return;
            }
            noDataState.classList.add('hidden'); container.classList.remove('hidden');
            container.innerHTML = '';

            state.announcements.forEach((a, i) => {
                const date = a.timestamp ? new Date(a.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                const imgHtml = a.imageUrl ? `<img src="${a.imageUrl}" class="mt-4 max-w-full rounded border border-slate-200">` : '';
                
                container.innerHTML += `
                <div class="bg-white border border-amber-300 rounded-xl shadow-sm overflow-hidden cursor-pointer group" onclick="this.querySelector('.content-body').classList.toggle('hidden')">
                    <div class="p-4 bg-amber-50/50 flex justify-between items-start group-hover:bg-amber-100/50">
                        <div>
                            <span class="bg-amber-400 text-amber-900 text-xs font-bold px-2 py-1 rounded mb-2 inline-block"><i class="fa-solid fa-bullhorn mr-1"></i> 公告 #${i + 1}</span>
                            <h3 class="text-xl font-bold text-slate-800 mt-1">${a.title}</h3>
                        </div>
                        <div class="text-sm text-slate-500 font-bold bg-white px-2 py-1 rounded border">時間: ${date}</div>
                    </div>
                    <div class="content-body p-5 border-t border-amber-100 text-slate-700 font-medium text-lg leading-relaxed bg-white">
                        ${a.content.replace(/\n/g, '<br>')}
                        ${imgHtml}
                    </div>
                </div>`;
            });
        }

        // Admin CRUD (簡化)
        function openFormModal(type, dataId = null) {
            const modal = document.getElementById('modal-form');
            const saveBtn = document.getElementById('btn-form-save');
            let html = '';
            
            if (type === 'class') {
                const d = dataId ? state.classes.find(c => c.id === dataId) : { name: '', grade: '7', pin: '1234', expected: 30, actual: 30 };
                html = `
                    <div class="space-y-4">
                        <div><label class="font-bold text-sm">班級名稱</label><input type="text" id="i-name" class="w-full border p-2 rounded" value="${d.name}"></div>
                        <div><label class="font-bold text-sm">年級</label><input type="text" id="i-grade" class="w-full border p-2 rounded" value="${d.grade}"></div>
                        <div><label class="font-bold text-sm">密碼</label><input type="text" id="i-pin" class="w-full border p-2 rounded" value="${d.pin}"></div>
                        <div class="flex gap-2">
                            <div class="flex-1"><label class="font-bold text-sm">應到</label><input type="number" id="i-exp" class="w-full border p-2 rounded" value="${d.expected}"></div>
                            <div class="flex-1"><label class="font-bold text-sm">實到</label><input type="number" id="i-act" class="w-full border p-2 rounded" value="${d.actual}"></div>
                        </div>
                    </div>`;
                saveBtn.onclick = async () => {
                    const p = { name: document.getElementById('i-name').value, grade: document.getElementById('i-grade').value, pin: document.getElementById('i-pin').value, expected: parseInt(document.getElementById('i-exp').value), actual: parseInt(document.getElementById('i-act').value) };
                    if(dataId) await updateDoc(doc(db, getCollectionPath('classes'), dataId), p);
                    else await addDoc(collection(db, getCollectionPath('classes')), p);
                    modal.classList.remove('active'); showMsg('成功', '儲存完畢', 'success');
                };
            } else if (type === 'schedule') {
                const d = dataId ? state.schedules.find(s => s.id === dataId) : { subject: '', grade: '7', startTime: '08:10', endTime: '09:30' };
                html = `
                    <div class="space-y-4">
                        <div><label class="font-bold text-sm">科目</label><input type="text" id="i-sub" class="w-full border p-2 rounded" value="${d.subject}"></div>
                        <div><label class="font-bold text-sm">適用年級</label><input type="text" id="i-grd" class="w-full border p-2 rounded" value="${d.grade}"></div>
                        <div class="flex gap-2">
                            <div class="flex-1"><label class="font-bold text-sm">開始</label><input type="time" id="i-st" class="w-full border p-2 rounded" value="${d.startTime}"></div>
                            <div class="flex-1"><label class="font-bold text-sm">結束</label><input type="time" id="i-et" class="w-full border p-2 rounded" value="${d.endTime}"></div>
                        </div>
                    </div>`;
                saveBtn.onclick = async () => {
                    const p = { subject: document.getElementById('i-sub').value, grade: document.getElementById('i-grd').value, startTime: document.getElementById('i-st').value, endTime: document.getElementById('i-et').value };
                    if(dataId) await updateDoc(doc(db, getCollectionPath('schedules'), dataId), p);
                    else await addDoc(collection(db, getCollectionPath('schedules')), p);
                    modal.classList.remove('active'); showMsg('成功', '儲存完畢', 'success');
                };
            } else if (type === 'announcement') {
                const d = dataId ? state.announcements.find(a => a.id === dataId) : { title: '', content: '', imageUrl: '', grade: '7' };
                html = `
                    <div class="space-y-4">
                        <div><label class="font-bold text-sm">標題</label><input type="text" id="i-ti" class="w-full border p-2 rounded" value="${d.title}"></div>
                        <div><label class="font-bold text-sm">適用年級</label><input type="text" id="i-gr" class="w-full border p-2 rounded" value="${d.grade}"></div>
                        <div><label class="font-bold text-sm">內容</label><textarea id="i-co" class="w-full border p-2 rounded h-24">${d.content}</textarea></div>
                        <div><label class="font-bold text-sm">圖片網址</label><input type="text" id="i-im" class="w-full border p-2 rounded" value="${d.imageUrl}"></div>
                    </div>`;
                saveBtn.onclick = async () => {
                    const p = { title: document.getElementById('i-ti').value, grade: document.getElementById('i-gr').value, content: document.getElementById('i-co').value, imageUrl: document.getElementById('i-im').value, timestamp: Date.now() };
                    if(dataId) await updateDoc(doc(db, getCollectionPath('announcements'), dataId), p);
                    else await addDoc(collection(db, getCollectionPath('announcements')), p);
                    modal.classList.remove('active'); showMsg('成功', '儲存完畢', 'success');
                };
            }
            document.getElementById('form-modal-body').innerHTML = html;
            modal.classList.add('active');
        }

        window.editItem = openFormModal;
        window.deleteItem = async (type, id) => {
            if(confirm("確定刪除？")) {
                let p = type === 'class' ? 'classes' : type === 'schedule' ? 'schedules' : 'announcements';
                await deleteDoc(doc(db, getCollectionPath(p), id));
            }
        };

        function renderAdminClasses() {
            const tbody = document.getElementById('admin-class-list'); tbody.innerHTML = '';
            state.classes.forEach(c => tbody.innerHTML += `<tr><td class="p-3">${c.name}</td><td class="p-3">${c.grade}</td><td class="p-3">${c.pin}</td><td class="p-3">${c.actual}/${c.expected}</td><td class="p-3"><button onclick="editItem('class', '${c.id}')" class="text-blue-500 mr-2"><i class="fa-solid fa-pen"></i></button><button onclick="deleteItem('class', '${c.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>`);
        }
        function renderAdminSchedules() {
            const tbody = document.getElementById('admin-schedule-list'); tbody.innerHTML = '';
            state.schedules.forEach(s => tbody.innerHTML += `<tr><td class="p-3">${s.subject}</td><td class="p-3">${s.grade}</td><td class="p-3">${s.startTime}-${s.endTime}</td><td class="p-3"><button onclick="editItem('schedule', '${s.id}')" class="text-blue-500 mr-2"><i class="fa-solid fa-pen"></i></button><button onclick="deleteItem('schedule', '${s.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td></tr>`);
        }
        function renderAdminAnnouncements() {
            const c = document.getElementById('admin-announcement-list'); c.innerHTML = '';
            state.announcements.forEach(a => c.innerHTML += `<div class="border rounded p-3 flex justify-between bg-slate-50"><div><h4 class="font-bold">${a.title} (對象: ${a.grade})</h4></div><div><button onclick="editItem('announcement', '${a.id}')" class="text-blue-500 mr-2"><i class="fa-solid fa-pen"></i></button><button onclick="deleteItem('announcement', '${a.id}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div></div>`);
        }

        function showMsg(title, content, type='info') {
            const m = document.getElementById('modal-msg');
            document.getElementById('msg-title').innerText = title; document.getElementById('msg-content').innerText = content;
            document.getElementById('msg-icon').innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-red-500"></i>' : '<i class="fa-solid fa-circle-check text-green-500"></i>';
            m.classList.add('active');
            document.getElementById('btn-msg-ok').onclick = () => m.classList.remove('active');
        }

        window.addEventListener('DOMContentLoaded', initFirebase);
    </script>
</body>
</html>
